<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #8ecae6;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .drift-a { animation: drift 46s linear infinite; }
    .drift-b { animation: drift 62s linear infinite; }
    .drift-c { animation: drift 38s linear infinite; }
    .bird-drift { animation: drift 26s linear infinite; }
    .wave { animation: wave 2.6s linear infinite; }
    .wave-b { animation: wave 4.4s linear infinite reverse; }
    .sun-rays {
      transform-box: view-box;
      transform-origin: 848px 78px;
      animation: spin 36s linear infinite;
    }
    .puff { opacity: 0; }
    .puff-a { animation: puff 1.1s ease-out infinite; }
    .puff-b { animation: puff 1.1s ease-out infinite 0.45s; }
    .puff-c { animation: puff 1.1s ease-out infinite 0.78s; }
    @keyframes drift { to { transform: translateX(-960px); } }
    @keyframes wave { to { transform: translateX(-80px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes puff {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0.45; }
      100% { transform: translate(-46px, -18px) scale(1.3); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .drift-a, .drift-b, .drift-c, .bird-drift,
      .wave, .wave-b, .sun-rays, .puff-a, .puff-b, .puff-c {
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <script>
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const NS = "http://www.w3.org/2000/svg";
    const BB = { x: 455, y: 372 };
    const PEDAL_R = 36;
    const GEAR = 2.35;
    const HIP_NEAR = { x: 432, y: 252 };
    const HIP_FAR = { x: 416, y: 260 };
    const THIGH = 72;
    const SHIN = 100;
    const CADENCE = (Math.PI * 2) / 1.15;

    const spinRear = document.getElementById("spin-rear");
    const spinFront = document.getElementById("spin-front");
    const chainring = document.getElementById("chainring");
    const bolts = document.getElementById("bolts");
    const crank = document.getElementById("crank");
    const crankHalo = document.getElementById("crank-halo");
    const farOutline = document.getElementById("far-outline");
    const farLeg = document.getElementById("far-leg");
    const nearOutline = document.getElementById("near-outline");
    const nearLeg = document.getElementById("near-leg");
    const farPedal = document.getElementById("far-pedal");
    const nearPedal = document.getElementById("near-pedal");
    const farToes = document.getElementById("far-toes");
    const nearToes = document.getElementById("near-toes");
    const rider = document.getElementById("rider");
    const riderHead = document.getElementById("rider-head");
    const nod = document.getElementById("nod");
    const wing = document.getElementById("wing");
    const tail = document.getElementById("tail");
    const eye = document.getElementById("eye");
    const lane = document.getElementById("lane");
    const shadow = document.getElementById("shadow");

    function spokes(group, cx, cy) {
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const line = document.createElementNS(NS, "line");
        line.setAttribute("x1", cx + Math.cos(a) * 12);
        line.setAttribute("y1", cy + Math.sin(a) * 12);
        line.setAttribute("x2", cx + Math.cos(a) * 38);
        line.setAttribute("y2", cy + Math.sin(a) * 38);
        group.appendChild(line);
      }
      const dot = document.createElementNS(NS, "rect");
      dot.setAttribute("x", cx - 4);
      dot.setAttribute("y", cy - 40);
      dot.setAttribute("width", "8");
      dot.setAttribute("height", "10");
      dot.setAttribute("rx", "2");
      dot.setAttribute("fill", "#e63946");
      dot.setAttribute("stroke", "none");
      group.appendChild(dot);
    }

    function wavePath(y, amp) {
      let d = `M -200 ${y}`;
      for (let x = -200; x < 1200; x += 80) {
        d += ` q 20 ${-amp} 40 0 t 40 0`;
      }
      return d;
    }

    spokes(spinRear, 300, 396);
    spokes(spinFront, 610, 396);
    for (let i = 0; i < 5; i++) {
      const a = ((i * 72 - 90) * Math.PI) / 180;
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", BB.x + Math.cos(a) * 13);
      c.setAttribute("cy", BB.y + Math.sin(a) * 13);
      c.setAttribute("r", "3");
      bolts.appendChild(c);
    }
    document.getElementById("wave-a").setAttribute("d", wavePath(348, 10));
    document.getElementById("wave-b").setAttribute("d", wavePath(366, 8));

    function knee(hip, foot) {
      const dx = foot.x - hip.x;
      const dy = foot.y - hip.y;
      const dist = Math.hypot(dx, dy) || 1;
      const reach = Math.min(dist, THIGH + SHIN - 0.5);
      const cosBend = (THIGH * THIGH + reach * reach - SHIN * SHIN) / (2 * THIGH * reach);
      const bend = Math.acos(Math.max(-1, Math.min(1, cosBend)));
      const aim = Math.atan2(dy, dx) - bend;
      return {
        x: hip.x + Math.cos(aim) * THIGH,
        y: hip.y + Math.sin(aim) * THIGH
      };
    }

    function setLeg(outline, fill, hip, foot) {
      const joint = knee(hip, foot);
      const points = `${hip.x.toFixed(1)},${hip.y.toFixed(1)} ${joint.x.toFixed(1)},${joint.y.toFixed(1)} ${foot.x.toFixed(1)},${foot.y.toFixed(1)}`;
      outline.setAttribute("points", points);
      fill.setAttribute("points", points);
    }

    function pedalPoint(angle) {
      return {
        x: BB.x + Math.cos(angle) * PEDAL_R,
        y: BB.y + Math.sin(angle) * PEDAL_R
      };
    }

    function draw(now) {
      const angle = (now / 1000) * CADENCE;
      const bob = Math.sin(angle * 2) * 4;
      const wheelDeg = ((angle * GEAR * 180) / Math.PI) % 360;
      const near = pedalPoint(angle);
      const far = pedalPoint(angle + Math.PI);
      const hipNear = { x: HIP_NEAR.x, y: HIP_NEAR.y + bob };
      const hipFar = { x: HIP_FAR.x, y: HIP_FAR.y + bob };

      spinRear.setAttribute("transform", `rotate(${wheelDeg} 300 396)`);
      spinFront.setAttribute("transform", `rotate(${wheelDeg} 610 396)`);
      chainring.setAttribute("transform", `rotate(${(angle * 180) / Math.PI} 455 372)`);

      crank.setAttribute("x1", near.x);
      crank.setAttribute("y1", near.y);
      crank.setAttribute("x2", far.x);
      crank.setAttribute("y2", far.y);
      crankHalo.setAttribute("x1", near.x);
      crankHalo.setAttribute("y1", near.y);
      crankHalo.setAttribute("x2", far.x);
      crankHalo.setAttribute("y2", far.y);

      setLeg(farOutline, farLeg, hipFar, far);
      setLeg(nearOutline, nearLeg, hipNear, near);
      farPedal.setAttribute("transform", `translate(${far.x} ${far.y})`);
      nearPedal.setAttribute("transform", `translate(${near.x} ${near.y})`);
      farToes.setAttribute("transform", `translate(0 -2) rotate(${Math.sin(angle + Math.PI) * 12}) scale(0.88)`);
      nearToes.setAttribute("transform", `translate(0 -2) rotate(${Math.sin(angle) * 12})`);

      rider.setAttribute("transform", `translate(0 ${bob})`);
      riderHead.setAttribute("transform", `translate(0 ${bob})`);
      nod.setAttribute("transform", `rotate(${Math.sin(angle * 2) * 2.4} 470 210)`);
      const flap = Math.sin((now / 1000) * Math.PI * 2 / 1.5) * 12 + Math.sin(angle) * 3;
      wing.setAttribute("transform", `rotate(${flap} 338 174)`);
      tail.setAttribute("transform", `rotate(${Math.sin(angle * 2 + 0.6) * 5} 320 236)`);

      const blinkWindow = now % 3800;
      const blink = blinkWindow > 3480 && blinkWindow < 3660 ? 0.12 : 1;
      eye.setAttribute("transform", `translate(522 128) scale(1 ${blink})`);

      const distance = angle * GEAR * 52;
      lane.setAttribute("stroke-dashoffset", distance);
      shadow.setAttribute("rx", 170 + Math.sin(angle * 2) * 8);
    }

    function tick(now) {
      draw(reduce ? 280 : now);
      if (!reduce) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
